# blanket glob over home/private_dot_cloudflared/**. See design.md decision D3.
keys:
  - &dotfiles_pilot age1xn4g43p4hpmvplqgzsn8tvrl48nv24vrqzksunum68v36ktlguusp6x6z8

creation_rules:
  - path_regex: ^home/private_dot_cloudflared/cert\.pem\.sops$
    age: *dotfiles_pilot
  - path_regex: ^home/private_dot_cloudflared/f2ab9336-44f9-4bfc-8c2e-5696fc9bc2e4\.json\.sops$
    age: *dotfiles_pilot
