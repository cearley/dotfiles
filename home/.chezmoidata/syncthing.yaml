# Syncthing shared-folder data, referenced by machines' `syncthing_folders` property via a
# name-based string reference (`syncthing_folders: syncthing_shared_folders`), resolved
# dynamically by the setup script (position 94) at template-render time.
#
# Entry schema (same shape used by a machine's own inline `syncthing_folders` list):
#   id         - Syncthing folder ID (must match across machines for the same shared folder)
#   label      - Human-readable folder name
#   path       - Local path (tilde-expanded at script runtime)
#   versioning (optional):
#     type     - Versioning strategy: simple | trashcan | staggered | external | none
#                Use "none" to explicitly clear versioning. Omit the entire versioning key
#                to leave existing versioning unchanged.
#     params   - Map of versioning parameters (all values must be strings). Keys are
#                Syncthing-native camelCase (e.g., keep, cleanoutDays).
#   ignores (optional):
#     List of Syncthing ignore patterns. Replaces the folder's .stignore on each apply.
#     Omit to leave the existing .stignore unchanged.
#
syncthing_shared_folders:
  - id: default
    label: Default Folder
    path: ~/Sync
    versioning:
      type: none
    ignores:
      - "(?d).DS_Store"
  - id: emmxp-fxjwr
    label: knowledge-personal
    path: ~/basic-memory
    versioning:
      type: simple
      params:
        cleanoutDays: "0"
        keep: "5"
    ignores:
      - "(?d).DS_Store"
  - id: gprnu-lxo9w
    label: Confidential
    path: ~/Confidential
    versioning:
      type: none
    ignores:
      - "(?d).DS_Store"
  - id: onhkl-pan5k
    label: Business
    path: ~/Business
    versioning:
      type: simple
      params:
        cleanoutDays: "0"
        keep: "5"
    ignores:
      - "(?d).DS_Store"
  - id: uqowz-v2f3n
    label: knowledge-work
    path: ~/.local/share/basic-memory
    versioning:
      type: simple
      params:
        cleanoutDays: "0"
        keep: "5"
    ignores:
      - "(?d).DS_Store"
