on: [push]

name: CI

jobs:

  lint_invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Check script position numbers are unique
        shell: bash
        run: |
          # Filenames in home/.chezmoiscripts/ encode execution order as a number
          # (see home-scripts.md). A duplicate number makes run order ambiguous.
          dupes="$(ls home/.chezmoiscripts/ | grep -oE '[0-9]+' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "❌ Duplicate script position number(s):"
            echo "$dupes"
            exit 1
          fi
          echo "✅ All script position numbers are unique"

      - name: Check Homebrew trusted-list covers all third-party taps/formulae
        shell: bash
        run: |
          # CLAUDE.md invariant: every third-party tap, and every brew/cask
          # installed from a third-party tap (owner/tap/formula form), must
          # also appear in packages.darwin.trusted or it silently installs
          # without `trusted: true` in the generated Brewfile (see
          # run_onchange_before_darwin-23-install-packages.sh.tmpl).
          yq -o=json home/.chezmoidata/packages.yaml > /tmp/packages.json
          result="$(jq -r '
            .packages.darwin as $d
            | ($d.trusted) as $trusted
            | [ $d | .. | objects | .taps? // empty | .[]? ] as $taps
            | [ $d | .. | objects | (.brews? // [], .casks? // [])[]? | select(contains("/")) ] as $slashed
            | ($taps + $slashed | unique) as $need
            | ($need - $trusted) as $missing
            | ($trusted - $need) as $extra
            | {missing: $missing, extra: $extra}
          ' /tmp/packages.json)"
          missing="$(echo "$result" | jq -r '.missing[]')"
          extra="$(echo "$result" | jq -r '.extra[]')"
          status=0
          if [ -n "$missing" ]; then
            echo "❌ Third-party tap/formula missing from packages.darwin.trusted:"
            echo "$missing"
            status=1
          fi
          if [ -n "$extra" ]; then
            echo "❌ packages.darwin.trusted has entries not used by any tap/brew/cask:"
            echo "$extra"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "✅ trusted list exactly matches third-party taps/formulae in use"
          fi
          exit "$status"

  shell_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Check script line counts (max 100 lines)
        shell: bash
        run: |
          # setup-memory-workflow scripts are kept small and single-purpose;
          # a file creeping past 100 lines is a signal it should be split.
          status=0
          for f in home/dot_claude/skills/setup-memory-workflow/scripts/*.sh; do
            lines="$(wc -l < "$f")"
            if [ "$lines" -gt 100 ]; then
              echo "❌ $f is $lines lines (max 100)"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "✅ All setup-memory-workflow scripts are within the 100-line budget"
          fi
          exit "$status"

      - name: shellcheck setup-memory-workflow scripts
        shell: bash
        run: |
          shellcheck home/dot_claude/skills/setup-memory-workflow/scripts/*.sh \
            && echo "✅ shellcheck passed" \
            || { echo "❌ shellcheck found issues"; exit 1; }

      - name: shellmetrics complexity check (CCN <= 15 per function)
        shell: bash
        run: |
          # shellmetrics (https://github.com/shellspec/shellmetrics) has no
          # tagged releases, so it's pinned to a specific commit rather than
          # master/latest. Fetched ephemeral: CI-only, not added to
          # packages.yaml (see design.md D6 in
          # redesign-setup-memory-workflow-session-reminder) since no
          # workstation script depends on it at runtime.
          SHELLMETRICS_COMMIT="b3bfff2af6880443112cdbf2ea449440b30ab9b0"
          curl -fsSL "https://raw.githubusercontent.com/shellspec/shellmetrics/${SHELLMETRICS_COMMIT}/shellmetrics" -o /usr/local/bin/shellmetrics
          chmod +x /usr/local/bin/shellmetrics

          # McCabe-style cyclomatic complexity ceiling per function. 15 (vs.
          # the classic 10) to allow for shell's heavier reliance on
          # case/if branching for argument and option parsing.
          CCN_THRESHOLD=15

          shellmetrics --csv home/dot_claude/skills/setup-memory-workflow/scripts/*.sh > /tmp/shellmetrics.csv
          status=0
          while IFS=',' read -r file func lineno lloc ccn lines comment blank; do
            [ "$file" = '"file"' ] && continue
            file="${file#\"}" file="${file%\"}"
            func="${func#\"}" func="${func%\"}"
            if [ "$ccn" -gt "$CCN_THRESHOLD" ]; then
              echo "❌ $file: $func has CCN=$ccn (max $CCN_THRESHOLD)"
              status=1
            fi
          done < /tmp/shellmetrics.csv
          if [ "$status" -eq 0 ]; then
            echo "✅ All functions are within the CCN $CCN_THRESHOLD complexity ceiling"
          fi
          exit "$status"

  test_remote_install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main

      - name: Test remote install script
        shell: bash
        run: |
          # Test the remote install script as a user would on a new macOS machine
          # This simulates running: sh -c "$(curl -fsSL https://raw.githubusercontent.com/cearley/dotfiles/remote_install.sh)"
          
          # Create minimal chezmoi data file to prevent prompting.
          # Must cover every promptStringOnce key in home/.chezmoi.toml.tmpl
          # (see `grep -n promptStringOnce home/.chezmoi.toml.tmpl`) -- a
          # missing key makes chezmoi try to open a TTY and hang/fail here.
          mkdir -p "$HOME/.config/chezmoi"
          cat > "$HOME/.config/chezmoi/chezmoi.toml" << 'EOF'
          [data]
              fullname = "CI Test"
              gh_username = "cearley"
              reverse_dns = "io.github.cearley"
              gh_commit_email = "ci@example.com"
              gh_commit_email_primary_work = "ci-work@example.com"
              microsoft_email = ""
              gh_packages_owner = ""
              gh_npm_registry = ""
              gh_nuget_source = ""
              gh_maven_repository = ""
              gh_pip_index = ""
              aws_secrets_manager_profile = "default"
              aws_secrets_manager_region = "us-east-1"
              keepassxc_db = "~/.local/share/chezmoi/keepassxc.kdbx"
              azure_devops_org = ""
              azure_devops_org_personal = ""
              # Empty: "core" packages always install regardless of tags, so this
              # gives minimal, headless-safe CI coverage. Any optional tag (work,
              # dev, ai, personal, datascience, mobile) may pull in a run_once_/
              # run_onchange_ script that opens a GUI installer and waits
              # indefinitely for a human (e.g. darwin-80-setup-microsoft-defender,
              # gated on "work") -- those can never complete on a headless runner.
              tags = []
          EOF

          # Run the script with timeout to prevent hanging (using gtimeout from coreutils)
          brew install coreutils
          gtimeout 900s ./remote_install.sh init --apply || {
            exit_code=$?
            if [ $exit_code -eq 124 ]; then
              echo "❌ Remote install script timed out after 15 minutes"
            else
              echo "❌ Remote install script failed with exit code: $exit_code"
            fi
            exit 1
          }
        env:
          REPO: ${{github.workspace}}

      - name: Verify remote install results
        shell: bash
        run: |
          # Verify that chezmoi was installed and initialized
          if ! command -v chezmoi >/dev/null 2>&1; then
            echo "❌ chezmoi was not installed by remote_install.sh"
            exit 1
          fi
          echo "✅ chezmoi is installed: $(chezmoi --version)"

          # Verify that chezmoi used this checkout as its source directory
          # (not a freshly-cloned/disconnected copy at the default location).
          # --source must be passed explicitly here too: chezmoi does not
          # persist it, it's a per-invocation flag, same as remote_install.sh.
          actual_source="$(chezmoi --source "$REPO" source-path)"
          expected_source="$REPO/home"
          if [ "$actual_source" != "$expected_source" ]; then
            echo "❌ chezmoi source directory is '$actual_source', expected this checkout at '$expected_source'"
            exit 1
          fi
          echo "✅ chezmoi source directory is this checkout ($actual_source)"

          # Verify apply actually rendered and wrote this checkout's home/ tree
          if [ ! -f "$HOME/.gitconfig" ]; then
            echo "❌ ~/.gitconfig was not applied from this checkout's home/ tree"
            exit 1
          fi
          echo "✅ this checkout's home/ tree was applied to the destination"
        env:
          REPO: ${{github.workspace}}

